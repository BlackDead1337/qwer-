<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mega Crash Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card: rgba(255, 255, 255, 0.05);
            --accent: #f0b90b;
            --success: #00ff88;
            --danger: #ff4d4d;
            --text: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Меню сверху */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .menu-btn { font-size: 24px; cursor: pointer; background: none; border: none; color: white; }

        /* Игровые секции */
        .page { display: none; flex-direction: column; flex-grow: 1; padding: 10px; overflow-y: auto; }
        .active { display: flex; }

        /* График и Икс */
        .crash-area { position: relative; height: 40vh; background: var(--card); border-radius: 20px; margin-bottom: 10px; overflow: hidden; }
        #multiplier { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4.5rem; font-weight: 900; z-index: 5; text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas { width: 100%; height: 100%; }

        /* Ставки */
        .bet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .bet-card { background: var(--card); padding: 12px; border-radius: 15px; display: flex; flex-direction: column; gap: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .bet-card input { background: rgba(0,0,0,0.3); border: 1px solid #444; color: white; padding: 8px; border-radius: 8px; font-size: 0.8rem; text-align: center; }
        .main-btn { border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-play { background: var(--success); color: #000; }
        .btn-stop { background: var(--accent); color: #000; }

        /* Кликер */
        .clicker-box { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .coin { width: 150px; height: 150px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; cursor: pointer; box-shadow: 0 0 30px var(--accent); transition: 0.1s; }
        .coin:active { transform: scale(0.95); }

        /* Чат */
        .chat-box { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .messages { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; font-size: 0.85rem; border-left: 3px solid var(--accent); }

        /* Хотбар */
        .hotbar { display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(0,0,0,0.8); padding: 10px 0 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; opacity: 0.5; cursor: pointer; }
        .nav-item.active-nav { opacity: 1; color: var(--accent); }
        .nav-item i { font-size: 1.4rem; margin-bottom: 2px; }

        /* Меню (Overlay) */
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    </style>
</head>
<body>

    <div id="overlay" onclick="this.style.display='none'">
        <h2>МЕНЮ</h2>
        <p>Создатель: @blackdead1337</p>
        <p>Версия: 2.0 PRO</p>
        <button class="main-btn btn-stop">ЗАКРЫТЬ</button>
    </div>

    <div class="top-nav">
        <div id="bal-top">💰 1000</div>
        <button class="menu-btn" onclick="document.getElementById('overlay').style.display='flex'">☰</button>
    </div>

    <div id="page-clicker" class="page">
        <div class="clicker-box">
            <div class="coin" onclick="clickCoin()">💎</div>
            <h3>Тапай для баланса!</h3>
        </div>
    </div>

    <div id="page-game" class="page active">
        <div class="crash-area" id="shake-target">
            <div id="multiplier">1.00x</div>
            <canvas id="chart"></canvas>
        </div>
        
        <div class="bet-row">
            <div class="bet-card">
                <input type="number" id="amt1" value="10" placeholder="Ставка">
                <input type="number" id="auto1" value="2.0" placeholder="Автостоп">
                <button id="btn1" class="main-btn btn-play" onclick="toggleBet(1)">СТАВКА 1</button>
            </div>
            <div class="bet-card">
                <input type="number" id="amt2" value="10" placeholder="Ставка">
                <input type="number" id="auto2" value="10.0" placeholder="Автостоп">
                <button id="btn2" class="main-btn btn-play" onclick="toggleBet(2)">СТАВКА 2</button>
            </div>
        </div>
    </div>

    <div id="page-chat" class="page">
        <div class="chat-box">
            <div id="chat-msgs" class="messages">
                <div class="msg"><b>Система:</b> Добро пожаловать в чат!</div>
            </div>
            <button class="main-btn btn-stop" onclick="sendCustomMsg()">Написать Привет</button>
        </div>
    </div>

    <div class="hotbar">
        <div class="nav-item" onclick="showPage('clicker', this)"><i>⛏️</i>КЛИКЕР</div>
        <div class="nav-item active-nav" onclick="showPage('game', this)"><i>🚀</i>ИГРА</div>
        <div class="nav-item" onclick="showPage('chat', this)"><i>💬</i>ЧАТ</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let isRunning = false;
        let currentX = 1.00;
        let crashPoint = 0;
        let bets = { 1: {active: false, amt: 0, auto: 0}, 2: {active: false, amt: 0, auto: 0} };

        // Инициализация графики
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        function res() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        window.onresize = res; res();

        // Функции баланса
        function clickCoin() { 
            balance += 1; 
            updateUI(); 
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateUI() {
            document.getElementById('bal-top').innerText = "💰 " + balance;
            tg.CloudStorage.setItem('bal', balance.toString());
        }

        // Логика страниц
        function showPage(p, el) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active-nav'));
            document.getElementById('page-'+p).classList.add('active');
            el.classList.add('active-nav');
        }

        // Логика игры
        function generateCrash() {
            let r = Math.random();
            if (r < 0.05) return 1.00; // 5% моментальный краш
            return (0.99 / (1 - Math.random())).toFixed(2);
        }

        function toggleBet(i) {
            if (isRunning) {
                cashOut(i);
                return;
            }
            let a = parseInt(document.getElementById('amt'+i).value);
            if (a > balance) return;
            bets[i].active = !bets[i].active;
            document.getElementById('btn'+i).style.boxShadow = bets[i].active ? "0 0 15px var(--success)" : "none";
            
            if (!isRunning) setTimeout(runGame, 500);
        }

        function runGame() {
            if (isRunning) return;
            let ready = false;
            [1, 2].forEach(i => {
                if(bets[i].active) {
                    bets[i].amt = parseInt(document.getElementById('amt'+i).value);
                    bets[i].auto = parseFloat(document.getElementById('auto'+i).value);
                    balance -= bets[i].amt;
                    ready = true;
                }
            });
            if (!ready) return;

            isRunning = true;
            crashPoint = generateCrash();
            currentX = 1.00;
            updateUI();

            let startTime = Date.now();

            function loop() {
                if (!isRunning) return;
                let t = (Date.now() - startTime) / 1000;
                currentX = Math.pow(1.08, t * 5);
                
                // Динамический цвет
                const disp = document.getElementById('multiplier');
                disp.innerText = currentX.toFixed(2) + "x";
                if (currentX < 2) disp.style.color = "#fff";
                else if (currentX < 10) disp.style.color = "#f0b90b";
                else disp.style.color = "#ff4d4d";

                // Автостоп
                [1,2].forEach(i => {
                    if (bets[i].active && currentX >= bets[i].auto) cashOut(i);
                });

                draw(t);

                if (currentX >= crashPoint) finish();
                else requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function cashOut(i) {
            if (bets[i].active && isRunning) {
                let win = Math.floor(bets[i].amt * currentX);
                balance += win;
                bets[i].active = false;
                document.getElementById('btn'+i).innerText = "ВЫИГРАЛ!";
                tg.HapticFeedback.notificationOccurred('success');
                if (currentX >= 10) addChatMsg(`🚀 Игрок сорвал x${currentX.toFixed(2)}!`);
                updateUI();
            }
        }

        function finish() {
            isRunning = false;
            document.getElementById('multiplier').style.color = "var(--danger)";
            document.getElementById('multiplier').innerText = "BOOM " + currentX.toFixed(2);
            [1,2].forEach(i => {
                bets[i].active = false;
                document.getElementById('btn'+i).innerText = "СТАВКА " + i;
            });
            updateUI();
        }

        function draw(t) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = varColor('--accent');
            ctx.lineWidth = 4;
            ctx.moveTo(0, canvas.height);
            let x = (t * 50) % canvas.width;
            let y = canvas.height - (Math.log10(currentX) * 200);
            ctx.quadraticCurveTo(x/2, canvas.height, x, y);
            ctx.stroke();
        }

        function varColor(n) { return getComputedStyle(document.documentElement).getPropertyValue(n); }

        function addChatMsg(t) {
            const m = document.getElementById('chat-msgs');
            m.innerHTML += `<div class="msg">${t}</div>`;
            m.scrollTop = m.scrollHeight;
        }

        function sendCustomMsg() { addChatMsg("<b>Вы:</b> Всем удачи! 🍀"); }

        // Загрузка
        tg.CloudStorage.getItem('bal', (e,v) => { if(v) balance = parseInt(v); updateUI(); });
    </script>
</body>
                                                                                  </html>
