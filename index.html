<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Crash Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #07070f;
            --panel: #12121e;
            --accent: #f0b90b;
            --success: #00ff88;
            --danger: #ff4d4d;
            --text: #ffffff;
            --tg-theme-bg-color: #07070f;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-user-select: none; }

        /* Шапка */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,0.05); }
        #bal-top { font-weight: 800; font-size: 1.1rem; color: var(--accent); }
        .profile-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }

        /* История */
        #history-bar { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: rgba(0,0,0,0.2); scrollbar-width: none; }
        #history-bar::-webkit-scrollbar { display: none; }
        .h-item { padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.05); font-size: 0.75rem; font-weight: bold; min-width: 45px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }

        /* Экран */
        .page { display: none; flex-direction: column; flex-grow: 1; padding: 12px; height: 100%; }
        .active { display: flex; }

        /* График */
        .crash-area { position: relative; height: 35vh; background: #000; border-radius: 24px; margin-bottom: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        #multiplier { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4.5rem; font-weight: 900; z-index: 5; transition: color 0.2s; }
        #timer-display { position: absolute; top: 15px; width: 100%; text-align: center; color: var(--accent); font-weight: bold; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; z-index: 4; }
        canvas { width: 100%; height: 100%; }

        /* Ставки */
        .bet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .bet-card { background: var(--panel); padding: 12px; border-radius: 20px; display: flex; flex-direction: column; gap: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .input-group { position: relative; }
        .input-label { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-bottom: 2px; display: block; padding-left: 4px; }
        input { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 12px; width: 100%; box-sizing: border-box; font-weight: bold; font-size: 0.9rem; }
        .main-btn { border: none; padding: 12px; border-radius: 14px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-play { background: var(--success); color: #002b18; box-shadow: 0 4px 15px rgba(0,255,136,0.2); }
        .btn-stop { background: var(--accent); color: #3d2f00; box-shadow: 0 4px 15px rgba(240,185,11,0.2); }
        .btn-share { background: #3498db; color: white; margin-top: 6px; font-size: 0.7rem; padding: 6px; display: none; }

        /* Игроки */
        .players-list { background: var(--panel); border-radius: 20px; padding: 15px; flex-grow: 1; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); }
        .player-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.85rem; }
        .status-win { color: var(--success); font-weight: bold; }
        .status-lost { color: var(--danger); }

        /* Чат */
        .messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 4px; }
        .msg { display: flex; gap: 10px; align-items: flex-end; }
        .msg-bubble { background: #1a1a2e; padding: 8px 14px; border-radius: 18px 18px 18px 4px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); max-width: 80%; }
        .msg-system { background: rgba(0, 255, 136, 0.05); border: 1px dashed var(--success); border-radius: 12px; padding: 10px; text-align: center; width: 100%; font-size: 0.8rem; }

        /* Кликер */
        .coin-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .coin { width: 190px; height: 190px; background: radial-gradient(circle, #f0b90b 0%, #b38a00 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 70px; cursor: pointer; box-shadow: 0 0 60px rgba(240, 185, 11, 0.2); border: 10px solid rgba(255,255,255,0.1); transition: 0.05s; }

        /* Модалка профиля */
        #menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; padding: 30px 20px; align-items: center; backdrop-filter: blur(10px); }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 25px 0; }
        .av-box { width: 60px; height: 60px; border-radius: 18px; background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 30px; border: 2px solid transparent; transition: 0.2s; cursor: pointer; }
        .av-box.selected { border-color: var(--accent); background: rgba(240, 185, 11, 0.15); box-shadow: 0 0 15px rgba(240, 185, 11, 0.3); }

        /* Хотбар */
        .hotbar { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--panel); padding: 12px 0 30px; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; opacity: 0.4; gap: 4px; }
        .nav-item.active-nav { opacity: 1; color: var(--accent); font-weight: bold; }
        
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%{transform:translate(0)} 25%{transform:translate(5px)} 50%{transform:translate(-5px)} 75%{transform:translate(5px)} 100%{transform:translate(0)} }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <h2 style="margin: 0; color: var(--accent)">ПРОФИЛЬ</h2>
        <div style="width: 100%; margin-top: 25px;">
            <span class="input-label">ВАШ НИКНЕЙМ</span>
            <input type="text" id="name-input" placeholder="Введите имя...">
        </div>
        <div class="avatar-grid" id="av-list"></div>
        <button class="main-btn btn-play" style="width: 100%; padding: 16px;" onclick="saveProfile()">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        <p style="margin-top:auto; font-size:0.75rem; opacity:0.5;">Dev: @blackdead1337</p>
        <button class="main-btn btn-stop" style="width: 100%; margin-top: 15px; background: rgba(255,255,255,0.1); color: white;" onclick="closeMenu()">ЗАКРЫТЬ</button>
    </div>

    <div id="history-bar"></div>

    <div class="top-nav">
        <div id="bal-top">💰 1,000</div>
        <div class="profile-trigger" onclick="openMenu()">
            <span id="my-av-top">🐙</span>
            <span id="my-name-top" style="font-weight: bold; font-size: 0.85rem;">Игрок</span>
        </div>
    </div>

    <div id="page-game" class="page active">
        <div class="crash-area" id="game-canvas-wrap">
            <div id="timer-display">Ожидание...</div>
            <div id="multiplier">1.00x</div>
            <canvas id="chart"></canvas>
        </div>
        
        <div class="bet-row">
            <div class="bet-card">
                <div class="input-group">
                    <span class="input-label">СУММА</span>
                    <input type="number" id="amt1" value="10">
                </div>
                <div class="input-group">
                    <span class="input-label">АВТО</span>
                    <input type="number" id="auto1" value="2.0" step="0.1">
                </div>
                <button id="btn1" class="main-btn btn-play" onclick="toggleBet(1)">СТАВКА</button>
                <button id="share1" class="main-btn btn-share" onclick="shareWin(1)">ПОДЕЛИТЬСЯ</button>
            </div>
            <div class="bet-card">
                <div class="input-group">
                    <span class="input-label">СУММА</span>
                    <input type="number" id="amt2" value="10">
                </div>
                <div class="input-group">
                    <span class="input-label">АВТО</span>
                    <input type="number" id="auto2" value="5.0" step="0.1">
                </div>
                <button id="btn2" class="main-btn btn-play" onclick="toggleBet(2)">СТАВКА</button>
                <button id="share2" class="main-btn btn-share" onclick="shareWin(2)">ПОДЕЛИТЬСЯ</button>
            </div>
        </div>

        <div class="players-list" id="players-in-game"></div>
    </div>

    <div id="page-clicker" class="page">
        <div class="coin-container">
            <div class="coin" onclick="clickCoin()">💎</div>
            <h2 id="click-status" style="margin-top: 30px;">ТАПАЙ 💎</h2>
            <p style="opacity:0.4; font-size:0.8rem;">Шанс 50% получить 1,000 монет</p>
        </div>
    </div>

    <div id="page-chat" class="page">
        <div class="messages" id="chat-msgs"></div>
        <div style="display:flex; gap:10px; padding-top: 10px;">
            <input type="text" id="chat-input" placeholder="Сообщение..." style="text-align: left;">
            <button class="main-btn btn-play" style="width: 60px;" onclick="sendMsg()">📡</button>
        </div>
    </div>

    <div class="hotbar">
        <div class="nav-item" onclick="showPage('clicker', this)"><i>⛏️</i>КЛИКЕР</div>
        <div class="nav-item active-nav" onclick="showPage('game', this)"><i>🚀</i>ИГРА</div>
        <div class="nav-item" onclick="showPage('chat', this)"><i>💬</i>ЧАТ</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let profile = { name: "Игрок", av: 0 };
        const avatars = ["🐙", "🐱", "🐶", "🦊", "🦁", "🐸", "🐻", "🦄", "🐉", "🤖", "🤡", "💎"];
        
        let balance = 1000;
        let isRunning = false;
        let isWaiting = false;
        let waitTime = 30;
        let currentX = 1.00;
        let crashPoint = 0;
        let history = [];
        let bets = { 
            1: {active: false, amt: 0, auto: 0, cashed: false, winX: 0}, 
            2: {active: false, amt: 0, auto: 0, cashed: false, winX: 0} 
        };

        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const multiDisp = document.getElementById('multiplier');

        function initAvatars() {
            const list = document.getElementById('av-list');
            list.innerHTML = '';
            avatars.forEach((av, i) => {
                let div = document.createElement('div');
                div.className = `av-box ${profile.av === i ? 'selected' : ''}`;
                div.innerHTML = av;
                div.onclick = () => {
                    profile.av = i;
                    document.querySelectorAll('.av-box').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                };
                list.appendChild(div);
            });
        }

        function openMenu() { document.getElementById('menu-overlay').style.display = 'flex'; document.getElementById('name-input').value = profile.name; }
        function closeMenu() { document.getElementById('menu-overlay').style.display = 'none'; }
        
        function saveProfile() {
            profile.name = document.getElementById('name-input').value.substring(0, 12) || "Игрок";
            tg.CloudStorage.setItem('profile_v2', JSON.stringify(profile));
            updateProfileUI();
            closeMenu();
        }

        function updateProfileUI() {
            document.getElementById('my-av-top').innerText = avatars[profile.av];
            document.getElementById('my-name-top').innerText = profile.name;
        }

        function clickCoin() {
            tg.HapticFeedback.impactOccurred('medium');
            let status = document.getElementById('click-status');
            if (Math.random() < 0.5) {
                balance += 1000;
                status.innerText = "МЕГА ВЫИГРЫШ! 🎉";
                status.style.color = "var(--success)";
            } else {
                balance += 1;
                status.innerText = "+1 монета";
                status.style.color = "white";
            }
            updateUI();
        }

        function startWaiting() {
            if (isWaiting || isRunning) return;
            isWaiting = true;
            waitTime = 30;
            updatePlayersDisplay();

            const timer = setInterval(() => {
                waitTime--;
                document.getElementById('timer-display').innerText = `Старт через ${waitTime}с`;
                if (waitTime <= 0) {
                    clearInterval(timer);
                    isWaiting = false;
                    runGame();
                }
            }, 1000);
        }

        function toggleBet(i) {
            if (isRunning) { cashOut(i); return; }
            let a = parseInt(document.getElementById('amt'+i).value);
            if (a > balance || a <= 0) { tg.showAlert("Недостаточно средств"); return; }

            bets[i].active = !bets[i].active;
            const btn = document.getElementById('btn'+i);
            btn.innerText = bets[i].active ? "ОТМЕНА" : "СТАВКА";
            btn.style.background = bets[i].active ? "rgba(255,255,255,0.1)" : "var(--success)";
            btn.style.color = bets[i].active ? "white" : "#002b18";
            document.getElementById('share'+i).style.display = "none";

            if (!isRunning && !isWaiting) startWaiting();
            updatePlayersDisplay();
        }

        function runGame() {
            let hasBets = false;
            [1, 2].forEach(i => {
                if(bets[i].active) {
                    bets[i].amt = parseInt(document.getElementById('amt'+i).value);
                    bets[i].auto = parseFloat(document.getElementById('auto'+i).value);
                    bets[i].cashed = false;
                    bets[i].winX = 0;
                    balance -= bets[i].amt;
                    hasBets = true;
                    document.getElementById('btn'+i).innerText = "ВЫЙТИ";
                    document.getElementById('btn'+i).className = "main-btn btn-stop";
                }
            });

            if (!hasBets) { document.getElementById('timer-display').innerText = "Ставок нет"; return; }

            isRunning = true;
            document.getElementById('timer-display').innerText = "В ПОЛЕТЕ";
            crashPoint = (0.99 / (1 - Math.random())).toFixed(2);
            if(Math.random() < 0.04) crashPoint = 1.00;

            currentX = 1.00;
            let startTime = Date.now();

            function loop() {
                if (!isRunning) return;
                let t = (Date.now() - startTime) / 1000;
                let growth = 0.06;
                if (currentX > 5) growth = 0.12;
                if (currentX > 15) growth = 0.25;
                
                currentX = Math.pow(1 + growth, t * 5);
                multiDisp.innerText = currentX.toFixed(2) + "x";
                multiDisp.style.color = currentX < 2 ? "white" : (currentX < 10 ? "var(--accent)" : "var(--danger)");

                [1,2].forEach(i => {
                    if (bets[i].active && !bets[i].cashed && currentX >= bets[i].auto) cashOut(i);
                });

                draw(t);
                updatePlayersDisplay();

                if (currentX >= crashPoint) finish();
                else requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function cashOut(i) {
            if (bets[i].active && isRunning && !bets[i].cashed) {
                let win = Math.floor(bets[i].amt * currentX);
                balance += win;
                bets[i].cashed = true;
                bets[i].winX = currentX.toFixed(2);
                document.getElementById('btn'+i).innerText = "ГОТОВО";
                document.getElementById('btn'+i).className = "main-btn btn-play";
                document.getElementById('share'+i).style.display = "block";
                tg.HapticFeedback.notificationOccurred('success');
                updateUI();
            }
        }

        function finish() {
            isRunning = false;
            document.getElementById('game-canvas-wrap').classList.add('shake');
            setTimeout(() => document.getElementById('game-canvas-wrap').classList.remove('shake'), 300);
            
            multiDisp.style.color = "var(--danger)";
            multiDisp.innerText = "CRASHED";
            
            history.unshift(currentX.toFixed(2));
            if (history.length > 15) history.pop();
            updateHistory();

            [1,2].forEach(i => {
                bets[i].active = false;
                document.getElementById('btn'+i).innerText = "СТАВКА";
                document.getElementById('btn'+i).className = "main-btn btn-play";
            });
            updateUI();
            updatePlayersDisplay();
            setTimeout(startWaiting, 3000);
        }

        function shareWin(i) {
            let x = bets[i].winX;
            let winAmt = Math.floor(parseInt(document.getElementById('amt'+i).value) * x);
            addChatMsg(`<div class="msg-system">🏆 <b>${profile.name}</b> затащил <b>x${x}</b><br>Выигрыш: <b>${winAmt.toLocaleString()}</b> 💎</div>`, true);
            document.getElementById('share'+i).style.display = "none";
            showPage('chat', document.querySelectorAll('.nav-item')[2]);
        }

        function draw(t) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            let w = canvas.width;
            let h = canvas.height;
            
            let x = (t * 40) % (w * 0.8);
            let y = h - (Math.log10(currentX) * (h * 0.6)) - 40;

            // Сетка
            ctx.strokeStyle = "rgba(255,255,255,0.03)";
            ctx.lineWidth = 1;
            for(let i=0; i<w; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,h); }
            for(let i=0; i<h; i+=50) { ctx.moveTo(0,i); ctx.lineTo(w,i); }
            ctx.stroke();

            // Градиент под линией
            let grad = ctx.createLinearGradient(0, h, x, y);
            grad.addColorStop(0, "rgba(240,185,11,0)");
            grad.addColorStop(1, "rgba(240,185,11,0.2)");
            
            ctx.beginPath();
            ctx.fillStyle = grad;
            ctx.moveTo(0, h);
            ctx.quadraticCurveTo(x/2, h, x, y);
            ctx.lineTo(x, h);
            ctx.fill();

            // Линия
            ctx.beginPath();
            ctx.strokeStyle = "var(--accent)";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.moveTo(0, h);
            ctx.quadraticCurveTo(x/2, h, x, y);
            ctx.stroke();

            // Точка
            ctx.beginPath();
            ctx.fillStyle = "#fff";
            ctx.arc(x, y, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 15;
            ctx.shadowColor = "var(--accent)";
        }

        function updateHistory() {
            document.getElementById('history-bar').innerHTML = history.map(x => {
                let color = x >= 10 ? 'var(--danger)' : (x >= 2 ? 'var(--success)' : 'white');
                return `<span class="h-item" style="color:${color}">${x}x</span>`;
            }).join('');
        }

        function updateUI() {
            document.getElementById('bal-top').innerText = "💰 " + balance.toLocaleString();
            tg.CloudStorage.setItem('bal_v2', balance.toString());
        }

        function updatePlayersDisplay() {
            const pList = document.getElementById('players-in-game');
            let html = '';
            [1,2].forEach(i => {
                if(bets[i].active) {
                    let statusHtml = '<span style="opacity:0.5">В игре...</span>';
                    if(bets[i].cashed) {
                        statusHtml = `<span class="status-win">+${bets[i].winX}x</span>`;
                    } else if(!isRunning && !isWaiting) {
                        statusHtml = `<span class="status-lost">❌</span>`;
                    }
                    html += `<div class="player-row">
                        <span>${avatars[profile.av]} ${profile.name}</span>
                        <span><b>${bets[i].amt}</b> 💎 ${statusHtml}</span>
                    </div>`;
                }
            });
            pList.innerHTML = html || '<div style="opacity:0.3; text-align:center; font-size:0.7rem; margin-top:10px;">ЖДЕМ ВАШУ СТАВКУ</div>';
        }

        function showPage(p, el) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active-nav'));
            document.getElementById('page-'+p).classList.add('active');
            el.classList.add('active-nav');
        }

        function sendMsg() {
            const inp = document.getElementById('chat-input');
            if (inp.value.trim()) {
                addChatMsg(`<b>${profile.name}:</b> ${inp.value}`);
                inp.value = '';
            }
        }

        function addChatMsg(t, isSys = false) {
            const m = document.getElementById('chat-msgs');
            const div = document.createElement('div');
            div.className = 'msg';
            if(isSys) {
                div.innerHTML = t;
            } else {
                div.innerHTML = `<div style="font-size:1.2rem">${avatars[profile.av]}</div><div class="msg-bubble">${t}</div>`;
            }
            m.appendChild(div);
            m.scrollTop = m.scrollHeight;
        }

        initAvatars();
        tg.CloudStorage.getItem('bal_v2', (e,v) => { if(v) balance = parseInt(v); updateUI(); });
        tg.CloudStorage.getItem('profile_v2', (e,v) => { if(v) { profile = JSON.parse(v); updateProfileUI(); initAvatars(); } else { updateProfileUI(); } });
        window.onresize = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
    </script>
</body>
</html>
