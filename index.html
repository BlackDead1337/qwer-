<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0e11;
            --card: #1b1f24;
            --accent: #f0b90b; /* Золотой стиль как на бирже */
            --success: #02c076;
            --danger: #f84960;
            --text: #eaecef;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; }
        .balance-info { font-size: 1.1rem; font-weight: bold; color: var(--accent); }

        /* История (10 штук) */
        .history-list { 
            display: flex; 
            gap: 6px; 
            overflow-x: auto; 
            padding: 10px 0; 
            scrollbar-width: none;
        }
        .history-list::-webkit-scrollbar { display: none; }
        .h-item { 
            min-width: 45px; 
            padding: 4px; 
            background: var(--card); 
            border-radius: 4px; 
            text-align: center; 
            font-size: 0.75rem; 
            font-weight: bold;
        }

        /* Игровое поле */
        .game-container { 
            position: relative; 
            flex-grow: 1; 
            background: var(--card); 
            border-radius: 12px; 
            margin: 5px 0; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        #crash-multiplier { 
            position: absolute; 
            top: 20%; 
            width: 100%; 
            text-align: center; 
            font-size: 3.5rem; 
            font-weight: 800; 
            z-index: 10;
            transition: transform 0.1s;
        }
        canvas { width: 100%; height: 100%; }

        /* Панели ставок (2 штуки) */
        .bet-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 0; }
        .bet-control { 
            background: var(--card); 
            padding: 10px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
        }
        input { 
            background: #2b3139; 
            border: 1px solid #474d57; 
            color: white; 
            padding: 8px; 
            border-radius: 6px; 
            text-align: center;
            font-size: 0.9rem;
        }
        .bet-btn { 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-bet { background: var(--success); color: black; }
        .btn-out { background: var(--accent); color: black; }
        .btn-bet:disabled { background: #474d57; color: #848e9c; }

        /* Анимация при краше */
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            20% { transform: translate(-3px, 0px); }
            40% { transform: translate(3px, 2px); }
            60% { transform: translate(-3px, 1px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-info">💰 <span id="balance">1000</span></div>
        <div style="font-size: 0.8rem; opacity: 0.6;">CRASH PRO</div>
    </div>

    <div class="history-list" id="history">
        </div>

    <div class="game-container" id="screen">
        <div id="crash-multiplier">1.00x</div>
        <canvas id="chart"></canvas>
    </div>

    <div class="bet-area">
        <div class="bet-control">
            <input type="number" id="bet1-amount" value="10">
            <button id="bet1-btn" class="bet-btn btn-bet">СТАВКА 1</button>
        </div>
        <div class="bet-control">
            <input type="number" id="bet2-amount" value="10">
            <button id="bet2-btn" class="bet-btn btn-bet">СТАВКА 2</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let balance = 1000;
        let isRunning = false;
        let currentX = 1.00;
        let crashPoint = 0;
        let history = [];
        
        // Данные ставок
        let playerBets = {
            1: { active: false, amount: 0, cashedOut: false },
            2: { active: false, amount: 0, cashedOut: false }
        };

        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const multiDisplay = document.getElementById('crash-multiplier');

        // Авто-адаптация размера канваса
        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.onresize = resize;
        resize();

        // Загрузка данных
        tg.CloudStorage.getItem('bal', (e, v) => { if(v) { balance = parseInt(v); updateUI(); }});
        tg.CloudStorage.getItem('hist', (e, v) => { if(v) { history = JSON.parse(v); updateUI(); }});

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            const histEl = document.getElementById('history');
            histEl.innerHTML = history.map(x => `<div class="h-item" style="color:${x >= 2 ? '#02c076' : '#f84960'}">${x}x</div>`).join('');
        }

        function generateCrashPoint() {
            // Реалистичный алгоритм: 1.00x падает в ~3% случаев. Большие иксы возможны, но редко.
            let e = 2**32;
            let h = crypto.getRandomValues(new Uint32Array(1))[0];
            if (h % 33 === 0) return 1.00;
            return Math.floor((100 * e - h) / (e - h)) / 100;
        }

        function startRound() {
            if (isRunning) return;
            
            // Проверка ставок
            let hasBets = false;
            [1, 2].forEach(i => {
                let amt = parseInt(document.getElementById(`bet${i}-amount`).value);
                if (playerBets[i].active && amt <= balance && amt > 0) {
                    playerBets[i].amount = amt;
                    playerBets[i].cashedOut = false;
                    balance -= amt;
                    hasBets = true;
                } else {
                    playerBets[i].active = false;
                    updateBtn(i, 'bet');
                }
            });

            if (!hasBets) return;

            isRunning = true;
            currentX = 1.00;
            crashPoint = generateCrashPoint();
            console.log("Crash at:", crashPoint); // Для теста

            let startTime = Date.now();
            updateUI();

            function step() {
                if (!isRunning) return;
                
                let now = Date.now();
                let duration = (now - startTime) / 1000;
                
                // Формула роста (экспонента)
                currentX = Math.pow(1.06, duration * 5); 
                
                multiDisplay.innerText = currentX.toFixed(2) + "x";
                multiDisplay.style.color = "white";

                drawGraph(duration);

                if (currentX >= crashPoint) {
                    doCrash();
                } else {
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        }

        function drawGraph(t) {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.beginPath();
            ctx.lineWidth = 5;
            ctx.strokeStyle = varColor('--accent');
            
            // Линия, которая идет вверх
            ctx.moveTo(0, canvas.height);
            let x = (t * 40) % canvas.width;
            let y = canvas.height - (Math.log10(currentX) * 200);
            
            ctx.bezierCurveTo(canvas.width/2, canvas.height, x, y, x, y);
            ctx.stroke();
            
            // Свечение под линией
            ctx.lineTo(x, canvas.height);
            ctx.lineTo(0, canvas.height);
            let grad = ctx.createLinearGradient(0,0,0,canvas.height);
            grad.addColorStop(0, 'rgba(240, 185, 11, 0.2)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

        function doCrash() {
            isRunning = false;
            multiDisplay.innerText = "BOOM " + currentX.toFixed(2) + "x";
            multiDisplay.style.color = varColor('--danger');
            document.getElementById('screen').classList.add('shake');
            setTimeout(() => document.getElementById('screen').classList.remove('shake'), 400);

            history.unshift(currentX.toFixed(2));
            if (history.length > 10) history.pop();

            [1, 2].forEach(i => {
                playerBets[i].active = false;
                updateBtn(i, 'bet');
            });

            tg.CloudStorage.setItem('bal', balance.toString());
            tg.CloudStorage.setItem('hist', JSON.stringify(history));
            updateUI();
        }

        function cashOut(i) {
            if (isRunning && playerBets[i].active && !playerBets[i].cashedOut) {
                let win = Math.floor(playerBets[i].amount * currentX);
                balance += win;
                playerBets[i].cashedOut = true;
                updateBtn(i, 'win');
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function updateBtn(i, state) {
            const b = document.getElementById(`bet${i}-btn`);
            if (state === 'bet') {
                b.innerText = `СТАВКА ${i}`;
                b.className = "bet-btn btn-bet";
            } else if (state === 'out') {
                b.innerText = `ЗАБРАТЬ`;
                b.className = "bet-btn btn-out";
            } else if (state === 'win') {
                b.innerText = `ВЫИГРЫШ!`;
                b.disabled = true;
                setTimeout(() => b.disabled = false, 1000);
            }
        }

        // Обработка кнопок
        [1, 2].forEach(i => {
            document.getElementById(`bet${i}-btn`).onclick = () => {
                if (!isRunning) {
                    playerBets[i].active = !playerBets[i].active;
                    document.getElementById(`bet${i}-btn`).style.opacity = playerBets[i].active ? "0.5" : "1";
                    // Если хоть одна ставка готова, запускаем через задержку или сразу
                    if (!isRunning) setTimeout(startRound, 500);
                } else {
                    cashOut(i);
                }
            };
        });

    </script>
</body>
</html>
