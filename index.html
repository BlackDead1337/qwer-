<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Crash Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --card: rgba(255, 255, 255, 0.08);
            --accent: #f0b90b;
            --success: #00ff88;
            --danger: #ff4d4d;
            --text: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Шапка и История */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.2); }
        #history-bar { display: flex; gap: 5px; padding: 5px 10px; overflow-x: hidden; background: rgba(0,0,0,0.3); font-size: 0.7rem; height: 25px; align-items: center; }
        .h-item { padding: 2px 6px; border-radius: 4px; background: var(--card); font-weight: bold; }

        /* Экраны */
        .page { display: none; flex-direction: column; flex-grow: 1; padding: 12px; overflow-y: auto; }
        .active { display: flex; }

        /* Игровая зона */
        .crash-area { position: relative; height: 35vh; background: rgba(0,0,0,0.4); border-radius: 24px; margin-bottom: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #multiplier { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; font-weight: 900; z-index: 5; text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #timer-display { position: absolute; top: 10px; width: 100%; text-align: center; color: var(--accent); font-weight: bold; font-size: 1.2rem; }
        canvas { width: 100%; height: 100%; }

        /* Ставки и Игроки */
        .bet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .bet-card { background: var(--card); padding: 12px; border-radius: 18px; display: flex; flex-direction: column; gap: 6px; }
        input { background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; text-align: center; }
        .main-btn { border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-play { background: var(--success); color: #000; }
        .btn-stop { background: var(--accent); color: #000; }
        
        .players-list { margin-top: 10px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 10px; flex-grow: 1; font-size: 0.8rem; overflow-y: auto; }
        .player-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* Кликер */
        .clicker-box { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .coin-wrap { position: relative; }
        .coin { 
            width: 180px; height: 180px; background: radial-gradient(circle, #f0b90b, #8a6d00); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 60px; cursor: pointer; box-shadow: 0 0 50px rgba(240, 185, 11, 0.4);
            border: 8px solid rgba(255,255,255,0.2); transition: transform 0.05s;
        }
        .coin:active { transform: scale(0.92); }

        /* Чат */
        .chat-box { flex-grow: 1; display: flex; flex-direction: column; height: 80%; }
        .messages { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 12px; margin-bottom: 10px; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex-grow: 1; text-align: left; }

        /* Хотбар */
        .hotbar { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #0b0e11; padding: 12px 0 30px; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; opacity: 0.4; transition: 0.3s; }
        .nav-item.active-nav { opacity: 1; color: var(--accent); }
        .nav-item i { font-size: 1.5rem; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="history-bar"></div>

    <div class="top-nav">
        <div id="bal-top">💰 1000</div>
        <button style="background:none; border:none; color:white; font-size:20px;" onclick="tg.showAlert('Создатель: @blackdead1337')">☰</button>
    </div>

    <div id="page-clicker" class="page">
        <div class="clicker-box">
            <div class="coin" onclick="clickCoin()">💎</div>
            <h2 id="click-status">Жми и богатей!</h2>
            <p style="opacity:0.6">Шанс 50% на 1,000 монет!</p>
        </div>
    </div>

    <div id="page-game" class="page active">
        <div class="crash-area" id="shake-target">
            <div id="timer-display">Ожидание ставок...</div>
            <div id="multiplier">1.00x</div>
            <canvas id="chart"></canvas>
        </div>
        
        <div class="bet-row">
            <div class="bet-card">
                <input type="number" id="amt1" value="10">
                <input type="number" id="auto1" value="2.0" step="0.1">
                <button id="btn1" class="main-btn btn-play" onclick="toggleBet(1)">СТАВКА 1</button>
            </div>
            <div class="bet-card">
                <input type="number" id="amt2" value="10">
                <input type="number" id="auto2" value="5.0" step="0.1">
                <button id="btn2" class="main-btn btn-play" onclick="toggleBet(2)">СТАВКА 2</button>
            </div>
        </div>

        <div class="players-list" id="players-in-game">
            <div style="opacity:0.5; text-align:center;">Ставок пока нет</div>
        </div>
    </div>

    <div id="page-chat" class="page">
        <div class="chat-box">
            <div id="chat-msgs" class="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ваше сообщение...">
                <button class="main-btn btn-play" style="padding:10px 20px" onclick="sendMsg()">📡</button>
            </div>
        </div>
    </div>

    <div class="hotbar">
        <div class="nav-item" onclick="showPage('clicker', this)"><i>⛏️</i>КЛИКЕР</div>
        <div class="nav-item active-nav" onclick="showPage('game', this)"><i>🚀</i>ИГРА</div>
        <div class="nav-item" onclick="showPage('chat', this)"><i>💬</i>ЧАТ</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let isRunning = false;
        let isWaiting = false;
        let waitTime = 30;
        let currentX = 1.00;
        let crashPoint = 0;
        let history = [];
        let bets = { 1: {active: false, amt: 0, auto: 0, cashed: false}, 2: {active: false, amt: 0, auto: 0, cashed: false} };

        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const multiDisp = document.getElementById('multiplier');
        const timerDisp = document.getElementById('timer-display');

        function res() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        window.onresize = res; res();

        // --- КЛИКЕР ---
        function clickCoin() {
            tg.HapticFeedback.impactOccurred('rigid');
            if (Math.random() < 0.5) {
                balance += 1000;
                document.getElementById('click-status').innerText = "+1,000 МОНЕТ! 🎉";
                document.getElementById('click-status').style.color = "var(--success)";
            } else {
                balance += 1;
                document.getElementById('click-status').innerText = "+1 монета";
                document.getElementById('click-status').style.color = "white";
            }
            updateUI();
        }

        // --- ЛОГИКА ОЖИДАНИЯ ---
        function startWaiting() {
            if (isWaiting || isRunning) return;
            isWaiting = true;
            waitTime = 30;
            
            // Генерируем фейковых игроков для массовки
            const pList = document.getElementById('players-in-game');
            pList.innerHTML = '<div class="player-row"><span>Вы (ожидание)</span><span>...</span></div>';

            const timer = setInterval(() => {
                waitTime--;
                timerDisp.innerText = `Начало через ${waitTime}с`;
                
                if (waitTime <= 0) {
                    clearInterval(timer);
                    isWaiting = false;
                    runGame();
                }
            }, 1000);
        }

        function toggleBet(i) {
            if (isRunning) { cashOut(i); return; }
            
            let a = parseInt(document.getElementById('amt'+i).value);
            if (a > balance || a <= 0) { tg.showAlert("Недостаточно монет!"); return; }

            bets[i].active = !bets[i].active;
            const btn = document.getElementById('btn'+i);
            btn.style.boxShadow = bets[i].active ? "0 0 15px var(--success)" : "none";
            btn.innerText = bets[i].active ? "ОТМЕНИТЬ" : "СТАВКА "+i;

            if (!isRunning && !isWaiting) startWaiting();
            updatePlayersDisplay();
        }

        function updatePlayersDisplay() {
            const pList = document.getElementById('players-in-game');
            pList.innerHTML = '';
            [1,2].forEach(i => {
                if(bets[i].active) {
                    pList.innerHTML += `<div class="player-row"><span>Ставка #${i}</span><span>${document.getElementById('amt'+i).value} 💎</span></div>`;
                }
            });
            // Добавим фейкового бота
            pList.innerHTML += `<div class="player-row" style="opacity:0.4"><span>LuckyJoe_bot</span><span>500 💎</span></div>`;
        }

        // --- ЯДРО ИГРЫ ---
        function runGame() {
            let ready = false;
            [1, 2].forEach(i => {
                if(bets[i].active) {
                    bets[i].amt = parseInt(document.getElementById('amt'+i).value);
                    bets[i].auto = parseFloat(document.getElementById('auto'+i).value);
                    bets[i].cashed = false;
                    balance -= bets[i].amt;
                    ready = true;
                    document.getElementById('btn'+i).innerText = "ЗАБРАТЬ";
                    document.getElementById('btn'+i).className = "main-btn btn-stop";
                }
            });

            if (!ready) { timerDisp.innerText = "Ожидание ставок..."; return; }

            isRunning = true;
            timerDisp.innerText = "ИГРА ИДЕТ!";
            crashPoint = (0.98 / (1 - Math.random())).toFixed(2);
            if (Math.random() < 0.03) crashPoint = 1.00; // Моментальный слив

            currentX = 1.00;
            let start = Date.now();

            function loop() {
                if (!isRunning) return;
                let t = (Date.now() - start) / 1000;
                
                // Прогрессивная скорость: чем выше икс, тем быстрее растет
                let speed = 0.08;
                if (currentX > 5) speed = 0.12;
                if (currentX > 8) speed = 0.18;
                if (currentX > 15) speed = 0.25;
                
                currentX = Math.pow(1 + speed, t * 5);
                
                multiDisp.innerText = currentX.toFixed(2) + "x";
                updateMultiplierColor();

                // Автостоп
                [1,2].forEach(i => {
                    if (bets[i].active && !bets[i].cashed && currentX >= bets[i].auto) cashOut(i);
                });

                draw(t);

                if (currentX >= crashPoint) finish();
                else requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function updateMultiplierColor() {
            if (currentX < 2) multiDisp.style.color = "#fff";
            else if (currentX < 10) multiDisp.style.color = varColor('--accent');
            else multiDisp.style.color = varColor('--danger');
        }

        function cashOut(i) {
            if (bets[i].active && isRunning && !bets[i].cashed) {
                let win = Math.floor(bets[i].amt * currentX);
                balance += win;
                bets[i].cashed = true;
                document.getElementById('btn'+i).innerText = "ВЗЯТО!";
                document.getElementById('btn'+i).className = "main-btn btn-play";
                tg.HapticFeedback.notificationOccurred('success');
                addChatMsg(`🚀 Ставка ${i} затащила x${currentX.toFixed(2)}!`);
                updateUI();
            }
        }

        function finish() {
            isRunning = false;
            multiDisp.style.color = "var(--danger)";
            multiDisp.innerText = "BOOM " + currentX.toFixed(2);
            
            history.unshift(currentX.toFixed(2));
            if (history.length > 10) history.pop();
            updateHistory();

            [1,2].forEach(i => {
                bets[i].active = false;
                document.getElementById('btn'+i).innerText = "СТАВКА " + i;
                document.getElementById('btn'+i).className = "main-btn btn-play";
                document.getElementById('btn'+i).style.boxShadow = "none";
            });
            
            updateUI();
            setTimeout(startWaiting, 2000); // Автозапуск нового раунда
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ---
        function draw(t) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = varColor('--accent');
            ctx.lineWidth = 5;
            ctx.moveTo(0, canvas.height);
            let x = (t * 40) % canvas.width;
            let y = canvas.height - (Math.log10(currentX) * 180);
            ctx.quadraticCurveTo(x/2, canvas.height, x, y);
            ctx.stroke();
        }

        function updateHistory() {
            const bar = document.getElementById('history-bar');
            bar.innerHTML = history.map(x => `<span class="h-item" style="color:${x > 2 ? 'var(--success)' : 'white'}">${x}x</span>`).join('');
        }

        function updateUI() {
            document.getElementById('bal-top').innerText = "💰 " + balance.toLocaleString();
            tg.CloudStorage.setItem('bal', balance.toString());
        }

        function showPage(p, el) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active-nav'));
            document.getElementById('page-'+p).classList.add('active');
            el.classList.add('active-nav');
        }

        function sendMsg() {
            const inp = document.getElementById('chat-input');
            if (inp.value.trim()) {
                addChatMsg(`<b>Вы:</b> ${inp.value}`);
                inp.value = '';
            }
        }

        function addChatMsg(t) {
            const m = document.getElementById('chat-msgs');
            m.innerHTML += `<div class="msg">${t}</div>`;
            m.scrollTop = m.scrollHeight;
        }

        function varColor(n) { return getComputedStyle(document.documentElement).getPropertyValue(n); }

        tg.CloudStorage.getItem('bal', (e,v) => { if(v) balance = parseInt(v); updateUI(); });
    </script>
</body>
                    </html>
