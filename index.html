<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Crash Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 100%);
            --card: rgba(255, 255, 255, 0.08);
            --accent: #f0b90b;
            --success: #00ff88;
            --danger: #ff4d4d;
            --text: #ffffff;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Шапка и История */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.1); }
        #history-bar { display: flex; gap: 6px; padding: 8px 15px; overflow-x: auto; background: rgba(0,0,0,0.2); font-size: 0.8rem; scrollbar-width: none; }
        .h-item { padding: 3px 8px; border-radius: 6px; background: var(--card); font-weight: bold; min-width: 40px; text-align: center; }

        /* Экраны */
        .page { display: none; flex-direction: column; flex-grow: 1; padding: 12px; overflow-y: auto; }
        .active { display: flex; }

        /* Игровая зона */
        .crash-area { position: relative; height: 32vh; background: rgba(0,0,0,0.5); border-radius: 24px; margin-bottom: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #multiplier { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4.5rem; font-weight: 900; z-index: 5; text-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #timer-display { position: absolute; top: 15px; width: 100%; text-align: center; color: var(--accent); font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; }
        canvas { width: 100%; height: 100%; }

        /* Ставки */
        .bet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .bet-card { background: var(--card); padding: 12px; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.03); }
        .input-group { display: flex; flex-direction: column; gap: 2px; }
        .input-label { font-size: 0.6rem; opacity: 0.5; padding-left: 5px; }
        input { background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; text-align: center; font-size: 0.9rem; }
        .main-btn { border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn-play { background: var(--success); color: #000; }
        .btn-stop { background: var(--accent); color: #000; }
        .btn-share { background: #3498db; color: white; margin-top: 5px; font-size: 0.7rem; padding: 5px; display: none; }

        /* Игроки */
        .players-list { margin-top: 10px; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 12px; flex-grow: 1; font-size: 0.8rem; overflow-y: auto; }
        .player-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; }
        .p-avatar { width: 20px; height: 20px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        /* Чат */
        .messages { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; }
        .msg { display: flex; align-items: flex-start; gap: 10px; animation: fadeIn 0.3s ease; }
        .msg-content { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; max-width: 80%; }
        .msg-win { border: 1px solid var(--success); background: rgba(0, 255, 136, 0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Кликер */
        .coin { width: 180px; height: 180px; background: radial-gradient(circle, #f0b90b, #b38a00); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; box-shadow: 0 0 50px rgba(240, 185, 11, 0.3); border: 8px solid rgba(255,255,255,0.15); }

        /* Меню Overlay */
        #menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; padding: 30px; align-items: center; }
        .avatar-select { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .av-opt { width: 50px; height: 50px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .av-opt.selected { border-color: var(--accent); transform: scale(1.1); }

        /* Хотбар */
        .hotbar { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #07070f; padding: 12px 0 35px; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; opacity: 0.4; transition: 0.3s; }
        .nav-item.active-nav { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <h2>НАСТРОЙКИ ПРОФИЛЯ</h2>
        <input type="text" id="name-input" placeholder="Введите ник" style="width: 80%; margin-top: 20px;">
        <div class="avatar-select" id="av-list"></div>
        <button class="main-btn btn-play" style="width: 80%;" onclick="saveProfile()">СОХРАНИТЬ</button>
        <p style="margin-top:40px; opacity:0.6; font-size:0.8rem;">Создатель: <a href="https://t.me/blackdead1337" style="color:var(--accent)">@blackdead1337</a></p>
        <button class="main-btn btn-stop" style="margin-top:20px;" onclick="closeMenu()">ЗАКРЫТЬ</button>
    </div>

    <div id="history-bar"></div>

    <div class="top-nav">
        <div id="bal-top">💰 1,000</div>
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="my-av-top" class="p-avatar" src="">
            <button style="background:none; border:none; color:white; font-size:24px;" onclick="openMenu()">☰</button>
        </div>
    </div>

    <div id="page-game" class="page active">
        <div class="crash-area">
            <div id="timer-display">Ожидание...</div>
            <div id="multiplier">1.00x</div>
            <canvas id="chart"></canvas>
        </div>
        
        <div class="bet-row">
            <div class="bet-card">
                <div class="input-group">
                    <span class="input-label">СТАВКА</span>
                    <input type="number" id="amt1" value="10">
                </div>
                <div class="input-group">
                    <span class="input-label">АВТОСТОП</span>
                    <input type="number" id="auto1" value="2.0" step="0.1">
                </div>
                <button id="btn1" class="main-btn btn-play" onclick="toggleBet(1)">СТАВКА 1</button>
                <button id="share1" class="main-btn btn-share" onclick="shareWin(1)">ПОДЕЛИТЬСЯ ИКСОМ</button>
            </div>
            <div class="bet-card">
                <div class="input-group">
                    <span class="input-label">СТАВКА</span>
                    <input type="number" id="amt2" value="10">
                </div>
                <div class="input-group">
                    <span class="input-label">АВТОСТОП</span>
                    <input type="number" id="auto2" value="5.0" step="0.1">
                </div>
                <button id="btn2" class="main-btn btn-play" onclick="toggleBet(2)">СТАВКА 2</button>
                <button id="share2" class="main-btn btn-share" onclick="shareWin(2)">ПОДЕЛИТЬСЯ ИКСОМ</button>
            </div>
        </div>

        <div class="players-list" id="players-in-game"></div>
    </div>

    <div id="page-clicker" class="page">
        <div class="clicker-box" style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex-grow:1; gap:20px;">
            <div class="coin" onclick="clickCoin()">💎</div>
            <h2 id="click-status">Нажми на удачу!</h2>
            <p style="opacity:0.5; font-size:0.8rem;">Шанс 50% сорвать 1,000 монет</p>
        </div>
    </div>

    <div id="page-chat" class="page">
        <div class="messages" id="chat-msgs"></div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="chat-input" placeholder="Написать сообщение..." style="flex-grow:1; text-align:left;">
            <button class="main-btn btn-play" onclick="sendMsg()">📡</button>
        </div>
    </div>

    <div class="hotbar">
        <div class="nav-item" onclick="showPage('clicker', this)"><i>⛏️</i>КЛИКЕР</div>
        <div class="nav-item active-nav" onclick="showPage('game', this)"><i>🚀</i>ИГРА</div>
        <div class="nav-item" onclick="showPage('chat', this)"><i>💬</i>ЧАТ</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Профиль
        let profile = { name: "Игрок", av: 1 };
        const avatars = [
            "🐙", "🐱", "🐶", "🐻", "🐸", "🐺", "🦊", "🦁"
        ];
        
        // Игровые данные
        let balance = 1000;
        let isRunning = false;
        let isWaiting = false;
        let waitTime = 30;
        let currentX = 1.00;
        let crashPoint = 0;
        let history = [];
        let bets = { 1: {active: false, amt: 0, auto: 0, cashed: false, lastWinX: 0}, 2: {active: false, amt: 0, auto: 0, cashed: false, lastWinX: 0} };

        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const multiDisp = document.getElementById('multiplier');

        function initAvatars() {
            const list = document.getElementById('av-list');
            avatars.forEach((av, i) => {
                let div = document.createElement('div');
                div.className = `av-opt ${profile.av === i ? 'selected' : ''}`;
                div.innerHTML = `<span style="font-size:30px">${av}</span>`;
                div.onclick = () => {
                    profile.av = i;
                    document.querySelectorAll('.av-opt').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                };
                list.appendChild(div);
            });
        }

        function openMenu() { document.getElementById('menu-overlay').style.display = 'flex'; document.getElementById('name-input').value = profile.name; }
        function closeMenu() { document.getElementById('menu-overlay').style.display = 'none'; }
        
        function saveProfile() {
            profile.name = document.getElementById('name-input').value || "Игрок";
            tg.CloudStorage.setItem('profile', JSON.stringify(profile));
            updateProfileUI();
            closeMenu();
        }

        function updateProfileUI() {
            document.getElementById('my-av-top').innerText = avatars[profile.av];
            // Имитация аватарки через Emoji (так как у нас нет внешних ссылок)
            document.getElementById('my-av-top').outerHTML = `<span id="my-av-top" class="p-avatar" style="font-size:20px">${avatars[profile.av]}</span>`;
        }

        // КЛИКЕР
        function clickCoin() {
            tg.HapticFeedback.impactOccurred('heavy');
            if (Math.random() < 0.5) {
                balance += 100000;
                document.getElementById('click-status').innerText = "Бонус +100,000! 💎";
                document.getElementById('click-status').style.color = "var(--success)";
            } else {
                balance += 1;
                document.getElementById('click-status').innerText = "+1 монета";
                document.getElementById('click-status').style.color = "white";
            }
            updateUI();
        }

        // ИГРА
        function startWaiting() {
            if (isWaiting || isRunning) return;
            isWaiting = true;
            waitTime = 30;
            updatePlayersDisplay();

            const timer = setInterval(() => {
                waitTime--;
                document.getElementById('timer-display').innerText = `СТАРТ ЧЕРЕЗ ${waitTime}с`;
                if (waitTime <= 0) {
                    clearInterval(timer);
                    isWaiting = false;
                    runGame();
                }
            }, 1000);
        }

        function toggleBet(i) {
            if (isRunning) { cashOut(i); return; }
            let a = parseInt(document.getElementById('amt'+i).value);
            if (a > balance || a <= 0) { tg.showAlert("Мало денег!"); return; }

            bets[i].active = !bets[i].active;
            document.getElementById('btn'+i).innerText = bets[i].active ? "ОТМЕНА" : "СТАВКА "+i;
            document.getElementById('btn'+i).style.background = bets[i].active ? "var(--danger)" : "var(--success)";
            document.getElementById('share'+i).style.display = "none";

            if (!isRunning && !isWaiting) startWaiting();
            updatePlayersDisplay();
        }

        function runGame() {
            let ready = false;
            [1, 2].forEach(i => {
                if(bets[i].active) {
                    bets[i].amt = parseInt(document.getElementById('amt'+i).value);
                    bets[i].auto = parseFloat(document.getElementById('auto'+i).value);
                    bets[i].cashed = false;
                    balance -= bets[i].amt;
                    ready = true;
                    document.getElementById('btn'+i).innerText = "ЗАБРАТЬ";
                    document.getElementById('btn'+i).className = "main-btn btn-stop";
                }
            });

            if (!ready) { document.getElementById('timer-display').innerText = "Ожидание ставок..."; return; }

            isRunning = true;
            document.getElementById('timer-display').innerText = "ВЗЛЕТ! 🚀";
            crashPoint = (0.99 / (1 - Math.random())).toFixed(2);
            if(Math.random() < 0.05) crashPoint = 1.00;

            currentX = 1.00;
            let start = Date.now();

            function loop() {
                if (!isRunning) return;
                let t = (Date.now() - start) / 1000;
                let speed = 0.07;
                if (currentX > 5) speed = 0.12;
                if (currentX > 15) speed = 0.22;
                
                currentX = Math.pow(1 + speed, t * 5);
                multiDisp.innerText = currentX.toFixed(2) + "x";
                multiDisp.style.color = currentX < 2 ? "white" : (currentX < 10 ? "var(--accent)" : "var(--danger)");

                [1,2].forEach(i => {
                    if (bets[i].active && !bets[i].cashed && currentX >= bets[i].auto) cashOut(i);
                });

                draw(t);
                if (currentX >= crashPoint) finish();
                else requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function cashOut(i) {
            if (bets[i].active && isRunning && !bets[i].cashed) {
                let win = Math.floor(bets[i].amt * currentX);
                balance += win;
                bets[i].cashed = true;
                bets[i].lastWinX = currentX.toFixed(2);
                document.getElementById('btn'+i).innerText = "ВЗЯТО!";
                document.getElementById('btn'+i).className = "main-btn btn-play";
                document.getElementById('share'+i).style.display = "block";
                tg.HapticFeedback.notificationOccurred('success');
                updateUI();
            }
        }

        function finish() {
            isRunning = false;
            multiDisp.style.color = "var(--danger)";
            multiDisp.innerText = "BOOM " + currentX.toFixed(2);
            
            history.unshift(currentX.toFixed(2));
            if (history.length > 10) history.pop();
            updateHistory();

            [1,2].forEach(i => {
                bets[i].active = false;
                document.getElementById('btn'+i).innerText = "СТАВКА " + i;
                document.getElementById('btn'+i).className = "main-btn btn-play";
            });
            updateUI();
            setTimeout(startWaiting, 2000);
        }

        function shareWin(i) {
            let x = bets[i].lastWinX;
            let winAmt = Math.floor(parseInt(document.getElementById('amt'+i).value) * x);
            addChatMsg(`<div class="msg-content msg-win">💎 <b>${profile.name}</b> поделился победой!<br>Поймал <b>x${x}</b> и выиграл <b>${winAmt.toLocaleString()}</b>!</div>`, true);
            document.getElementById('share'+i).style.display = "none";
            showPage('chat', document.querySelectorAll('.nav-item')[2]);
        }

        function draw(t) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
            ctx.lineWidth = 5;
            ctx.moveTo(0, canvas.height);
            let x = (t * 40) % canvas.width;
            let y = canvas.height - (Math.log10(currentX) * 160);
            ctx.quadraticCurveTo(x/2, canvas.height, x, y);
            ctx.stroke();
        }

        function updateHistory() {
            document.getElementById('history-bar').innerHTML = history.map(x => `<span class="h-item" style="color:${x > 2 ? 'var(--success)' : 'white'}">${x}x</span>`).join('');
        }

        function updateUI() {
            document.getElementById('bal-top').innerText = "💰 " + balance.toLocaleString();
            tg.CloudStorage.setItem('bal', balance.toString());
        }

        function updatePlayersDisplay() {
            const pList = document.getElementById('players-in-game');
            pList.innerHTML = '<div style="opacity:0.5; text-align:center; font-size:0.7rem;">ОЖИДАНИЕ ИГРОКОВ...</div>';
            let html = '';
            [1,2].forEach(i => {
                if(bets[i].active) html += `<div class="player-row"><span>${avatars[profile.av]} ${profile.name}</span><span>${document.getElementById('amt'+i).value} 💎</span></div>`;
            });
            if(html) pList.innerHTML = html;
        }

        function showPage(p, el) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active-nav'));
            document.getElementById('page-'+p).classList.add('active');
            el.classList.add('active-nav');
        }

        function sendMsg() {
            const inp = document.getElementById('chat-input');
            if (inp.value.trim()) {
                addChatMsg(`<b>${profile.name}:</b> ${inp.value}`);
                inp.value = '';
            }
        }

        function addChatMsg(t, isSystem = false) {
            const m = document.getElementById('chat-msgs');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            if (isSystem) {
                msgDiv.innerHTML = t;
            } else {
                msgDiv.innerHTML = `<span>${avatars[profile.av]}</span><div class="msg-content">${t}</div>`;
            }
            m.appendChild(msgDiv);
            m.scrollTop = m.scrollHeight;
        }

        // Загрузка
        initAvatars();
        tg.CloudStorage.getItem('bal', (e,v) => { if(v) balance = parseInt(v); updateUI(); });
        tg.CloudStorage.getItem('profile', (e,v) => { if(v) { profile = JSON.parse(v); updateProfileUI(); } else { updateProfileUI(); } });
        window.onresize = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
    </script>
</body>
                    </html>
