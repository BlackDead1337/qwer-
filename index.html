<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Crash Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0b15;
            --panel: rgba(255, 255, 255, 0.05);
            --accent: #f0b90b;
            --success: #00ff88;
            --danger: #ff4d4d;
            --text: #ffffff;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; }

        /* Шапка */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); }
        #bal-top { font-weight: 800; color: var(--accent); font-size: 1.1rem; }
        .admin-btn { opacity: 0.3; font-size: 1.2rem; cursor: pointer; }

        /* История */
        #history-bar { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.3); scrollbar-width: none; min-height: 25px;}
        #history-bar::-webkit-scrollbar { display: none; }
        .h-item { padding: 4px 12px; border-radius: 20px; background: var(--panel); font-size: 0.8rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.05); }

        /* Игровое поле */
        .page { display: none; flex-direction: column; height: 85vh; padding: 10px; box-sizing: border-box; }
        .active { display: flex; }
        
        .crash-area { position: relative; height: 30vh; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
        #multiplier { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: 900; z-index: 5; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #timer-display { position: absolute; top: 15px; width: 100%; text-align: center; color: var(--accent); font-weight: bold; z-index: 4; }
        canvas { width: 100%; height: 100%; }

        /* Ставки */
        .bet-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .bet-card { background: var(--panel); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .input-group { margin-bottom: 8px; }
        .input-label { font-size: 0.6rem; opacity: 0.5; margin-bottom: 2px; display: block; }
        input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box; font-weight: bold; }
        
        .main-btn { width: 100%; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-play { background: var(--success); color: #000; }
        .btn-waiting { background: #333; color: #fff; opacity: 0.7; }
        .btn-stop { background: var(--accent); color: #000; }

        /* Список игроков */
        .players-list { background: var(--panel); border-radius: 15px; flex-grow: 1; overflow-y: auto; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .player-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 0.8rem; }
        .p-win { color: var(--success); font-weight: bold; }
        .p-lost { color: var(--danger); opacity: 0.7; }

        /* Админ-панель */
        #admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        /* Нижнее меню */
        .hotbar { position: fixed; bottom: 0; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); background: #12121e; padding: 15px 0 30px; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { text-align: center; opacity: 0.4; font-size: 0.7rem; }
        .nav-item.active-nav { opacity: 1; color: var(--accent); }

        .shake { animation: shake 0.2s ease-in-out 0s 2; }
        @keyframes shake { 0% { margin-left: 0rem; } 25% { margin-left: 0.5rem; } 75% { margin-left: -0.5rem; } 100% { margin-left: 0rem; } }
    </style>
</head>
<body>

    <div id="admin-modal">
        <h3>ТЕСТ: СЛЕДУЮЩИЙ ИКС</h3>
        <input type="number" id="next-crash-input" step="0.1" placeholder="Например: 5.5">
        <button class="main-btn btn-play" style="margin-top: 15px;" onclick="setNextCrash()">УСТАНОВИТЬ</button>
        <button class="main-btn" style="margin-top: 10px; background: #444;" onclick="document.getElementById('admin-modal').style.display='none'">ОТМЕНА</button>
    </div>

    <div class="top-nav">
        <div id="bal-top">💰 1,000</div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div class="admin-btn" onclick="document.getElementById('admin-modal').style.display='flex'">⚙️</div>
            <div class="profile-trigger" onclick="tg.showAlert('Профиль в разработке')">👤</div>
        </div>
    </div>

    <div id="history-bar"></div>

    <div id="page-game" class="page active">
        <div class="crash-area" id="canvas-container">
            <div id="timer-display">ОЖИДАНИЕ...</div>
            <div id="multiplier">1.00x</div>
            <canvas id="chart"></canvas>
        </div>

        <div class="bet-container">
            <div class="bet-card">
                <div class="input-group">
                    <span class="input-label">СУММА</span>
                    <input type="number" id="amt1" value="100">
                </div>
                <div class="input-group">
                    <span class="input-label">АВТОСТОП</span>
                    <input type="number" id="auto1" value="2.0" step="0.1">
                </div>
                <button id="btn1" class="main-btn btn-play" onclick="placeBet(1)">СТАВКА</button>
            </div>
            <div class="bet-card">
                <div class="input-group">
                    <span class="input-label">СУММА</span>
                    <input type="number" id="amt2" value="100">
                </div>
                <div class="input-group">
                    <span class="input-label">АВТОСТОП</span>
                    <input type="number" id="auto2" value="1.5" step="0.1">
                </div>
                <button id="btn2" class="main-btn btn-play" onclick="placeBet(2)">СТАВКА</button>
            </div>
        </div>

        <div class="players-list" id="players-box"></div>
    </div>

    <div id="page-clicker" class="page">КЛИКЕР В РАЗРАБОТКЕ</div>
    <div id="page-chat" class="page">ЧАТ В РАЗРАБОТКЕ</div>

    <nav class="hotbar">
        <div class="nav-item" onclick="showPage('clicker', this)">⛏️<br>КЛИКЕР</div>
        <div class="nav-item active-nav" onclick="showPage('game', this)">🚀<br>ИГРА</div>
        <div class="nav-item" onclick="showPage('chat', this)">💬<br>ЧАТ</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        let isRunning = false;
        let isWaiting = false;
        let currentX = 1.00;
        let crashPoint = 0;
        let nextCrashOverride = null;
        let gameHistory = [];
        
        // Ставки игрока
        let playerBets = {
            1: { state: 'none', amt: 0, auto: 0, win: 0 }, // none, queued, active, cashed
            2: { state: 'none', amt: 0, auto: 0, win: 0 }
        };

        // Боты
        let currentBots = [];
        const botNames = ["Ivan_G", "CryptoKing", "LuckyMan", "DogeLover", "Satoshi", "Turbo_Max", "Zenith", "MoonBoy", "Whale_Watcher"];

        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');

        function setNextCrash() {
            let val = parseFloat(document.getElementById('next-crash-input').value);
            if(val >= 1) {
                nextCrashOverride = val;
                document.getElementById('admin-modal').style.display = 'none';
                tg.showScanQrPopup({ text: "Читы активированы!" });
                setTimeout(() => tg.closeScanQrPopup(), 1000);
            }
        }

        function showPage(name, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-nav'));
            document.getElementById('page-' + name).classList.add('active');
            el.classList.add('active-nav');
        }

        function updateUI() {
            document.getElementById('bal-top').innerText = "💰 " + Math.floor(balance).toLocaleString();
            
            // Обновление кнопок
            for(let i=1; i<=2; i++) {
                let btn = document.getElementById('btn' + i);
                let state = playerBets[i].state;
                
                if(state === 'queued') {
                    btn.innerText = "В ОЧЕРЕДИ...";
                    btn.className = "main-btn btn-waiting";
                } else if(state === 'active') {
                    btn.innerText = "ЗАБРАТЬ";
                    btn.className = "main-btn btn-stop";
                } else if(state === 'none' || state === 'cashed') {
                    btn.innerText = "СТАВКА";
                    btn.className = "main-btn btn-play";
                }
            }
        }

        function placeBet(i) {
            if(playerBets[i].state === 'active') {
                cashOut(i);
                return;
            }

            let amt = parseInt(document.getElementById('amt'+i).value);
            let auto = parseFloat(document.getElementById('auto1').value);
            if(amt > balance) { tg.showAlert("Недостаточно монет!"); return; }

            playerBets[i].amt = amt;
            playerBets[i].auto = parseFloat(document.getElementById('auto' + i).value);
            
            if(isRunning) {
                playerBets[i].state = 'queued';
            } else {
                playerBets[i].state = 'active';
                balance -= amt;
                if(!isWaiting) startPreGame();
            }
            updateUI();
        }

        function cashOut(i) {
            if(playerBets[i].state === 'active' && isRunning) {
                let win = playerBets[i].amt * currentX;
                balance += win;
                playerBets[i].win = currentX;
                playerBets[i].state = 'cashed';
                tg.HapticFeedback.notificationOccurred('success');
                updateUI();
            }
        }

        function generateBots() {
            currentBots = [];
            let count = Math.floor(Math.random() * 5) + 3;
            for(let i=0; i<count; i++) {
                currentBots.push({
                    name: botNames[Math.floor(Math.random()*botNames.length)],
                    amt: Math.floor(Math.random() * 500) + 50,
                    target: (Math.random() * 5 + 1.1).toFixed(2),
                    win: 0,
                    lost: false
                });
            }
        }

        function startPreGame() {
            isWaiting = true;
            let timer = 5;
            generateBots();
            
            const intv = setInterval(() => {
                timer -= 0.1;
                document.getElementById('timer-display').innerText = `ДО ВЗЛЕТА: ${timer.toFixed(1)}s`;
                updatePlayersList();
                
                if(timer <= 0) {
                    clearInterval(intv);
                    isWaiting = false;
                    runGame();
                }
            }, 100);
        }

        function runGame() {
            isRunning = true;
            document.getElementById('timer-display').innerText = "ВЗЛЕТ!";
            
            // Расчет точки краша
            if(nextCrashOverride) {
                crashPoint = nextCrashOverride;
                nextCrashOverride = null;
            } else {
                let r = Math.random();
                crashPoint = (0.98 / (1 - r)).toFixed(2);
                if(r < 0.05) crashPoint = 1.00; // Моментальный краш 5%
            }

            currentX = 1.00;
            let start = Date.now();

            function tick() {
                if(!isRunning) return;
                
                let elapsed = (Date.now() - start) / 1000;
                currentX = Math.pow(1.08, elapsed * 5); // Скорость роста

                document.getElementById('multiplier').innerText = currentX.toFixed(2) + "x";

                // Автостоп игрока
                for(let i=1; i<=2; i++) {
                    if(playerBets[i].state === 'active' && currentX >= playerBets[i].auto) {
                        cashOut(i);
                    }
                }

                // Логика ботов
                currentBots.forEach(b => {
                    if(b.win === 0 && !b.lost && currentX >= b.target) {
                        b.win = b.target;
                    }
                });

                drawChart(elapsed);
                updatePlayersList();

                if(currentX >= crashPoint) {
                    endGame();
                } else {
                    requestAnimationFrame(tick);
                }
            }
            tick();
        }

        function endGame() {
            isRunning = false;
            document.getElementById('multiplier').innerText = "BOOM " + currentX.toFixed(2);
            document.getElementById('multiplier').style.color = "var(--danger)";
            document.getElementById('canvas-container').classList.add('shake');

            // История
            gameHistory.unshift(currentX.toFixed(2));
            if(gameHistory.length > 10) gameHistory.pop();
            renderHistory();

            // Проверка проигрыша ботов
            currentBots.forEach(b => { if(b.win === 0) b.lost = true; });

            // Сброс ставок
            setTimeout(() => {
                document.getElementById('canvas-container').classList.remove('shake');
                document.getElementById('multiplier').style.color = "#fff";
                
                for(let i=1; i<=2; i++) {
                    if(playerBets[i].state === 'queued') {
                        playerBets[i].state = 'active';
                        balance -= playerBets[i].amt;
                    } else {
                        playerBets[i].state = 'none';
                    }
                    playerBets[i].win = 0;
                }
                
                updateUI();
                startPreGame();
            }, 3000);
        }

        function updatePlayersList() {
            let html = "";
            // Игрок
            for(let i=1; i<=2; i++) {
                if(playerBets[i].state !== 'none' && playerBets[i].state !== 'queued') {
                    let status = "В игре";
                    let cls = "";
                    if(playerBets[i].state === 'cashed') {
                        status = `+${(playerBets[i].amt * playerBets[i].win).toFixed(0)} (x${playerBets[i].win})`;
                        cls = "p-win";
                    } else if (!isRunning && !isWaiting) {
                        status = "❌";
                        cls = "p-lost";
                    }
                    html += `<div class="player-row"><span>👤 Вы (Слот ${i})</span><span class="${cls}">${status}</span></div>`;
                }
            }
            // Боты
            currentBots.forEach(b => {
                let status = b.amt + " 💎";
                let cls = "";
                if(b.win > 0) {
                    status = `+${(b.amt * b.win).toFixed(0)} (x${b.win})`;
                    cls = "p-win";
                } else if(b.lost) {
                    status = "❌";
                    cls = "p-lost";
                }
                html += `<div class="player-row"><span>🤖 ${b.name}</span><span class="${cls}">${status}</span></div>`;
            });
            document.getElementById('players-box').innerHTML = html;
        }

        function renderHistory() {
            document.getElementById('history-bar').innerHTML = gameHistory.map(x => `<div class="h-item" style="color:${x > 2 ? 'var(--success)' : '#fff'}">${x}x</div>`).join('');
        }

        function drawChart(t) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            let w = canvas.width;
            let h = canvas.height;

            ctx.beginPath();
            ctx.strokeStyle = "var(--accent)";
            ctx.lineWidth = 4;
            ctx.moveTo(0, h);
            
            let targetX = (t * 50) % w;
            let targetY = h - (Math.log10(currentX) * 200);
            
            ctx.quadraticCurveTo(targetX/2, h, targetX, targetY);
            ctx.stroke();
            
            // Свечение под графиком
            ctx.lineTo(targetX, h);
            ctx.lineTo(0, h);
            let grad = ctx.createLinearGradient(0,0,0,h);
            grad.addColorStop(0, "rgba(240,185,11,0.2)");
            grad.addColorStop(1, "transparent");
            ctx.fillStyle = grad;
            ctx.fill();
        }

        window.onresize = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
        updateUI();
        startPreGame();
    </script>
</body>
            </html>
